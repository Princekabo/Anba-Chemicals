<h1>Request a quote</h1>
<p class="lead">Tell us what you need and we will reply within one working day.</p>
<form id="qf">
<label>Name<input required autocomplete="name"></label>
<label>Company<input autocomplete="organization"></label>
<label>Email<input type="email" required autocomplete="email"></label>
<label>Phone<input type="tel" autocomplete="tel"></label>
<label class="full">What do you need?<textarea rows="4"></textarea></label>
<button class="btn" type="submit">Send request</button>
<p id="ok" role="status"></p>
</form>
